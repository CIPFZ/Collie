# Collie 配置文件
# 本文件由 R1 依据 SPEC 3.1 放置；阈值须与 SPEC 完全一致（铁律 11）。
# worker 只读。v0.1 实现 `collie init` 后由其从模板生成。

schema_version = 1

[project]
name = "collie"
repo = "https://github.com/CIPFZ/Collie"

[agent.worker]
# SPEC 3.1
model = "claude-opus-4-6"
allowed_tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash"]
max_turns = 200
permission_mode = "bypassPermissions"   # SPEC 3.1 v0.1 裁定：无人值守下询问即卡死

[agent.reviewer]
# SPEC 3.1：无 Write/Edit，物理上无法改代码（ROLES 2 R4、铁律 6）
model = "claude-opus-4-6"
allowed_tools = ["Read", "Glob", "Grep", "Bash"]
max_turns = 60
permission_mode = "bypassPermissions"   # SPEC 3.1；白名单仍无 Write/Edit

[limits]
stall_secs = 90          # SPEC 3.1；事件流静默判定卡死（v0.2 生效）
progress_secs = 900      # SPEC 3.1；有事件但无产出判定空转（v0.2 生效）
wallclock_secs = 2700    # SPEC 3.1；单批次墙钟硬顶
resume_max = 2           # SPEC 3.1；resume 上限（v0.2 生效）
fix_max = 2              # SPEC 3.1；同批次 FIX 上限（v0.3 生效）
dry_k = 2                # SPEC 3.1；连续 dry 轮数（v0.5 生效）
ci_wait_secs = 1800     # SPEC 3.1；R2 取证前等待 head_sha 的 CI 出结论的上限，超时按 unknown 处理
ci_poll_secs = 30       # 等待期间查询 CI 的间隔（v01-b05 2c 裁定）

[verify]
# SPEC 3.1；reviewer 必跑的全局命令，批次级命令在 task 中追加
commands = ["npm run lint", "npm run typecheck", "npm test"]

[ci]
# SPEC 3.1；用于核对 CI 实际监听分支，防止「假全绿」（铁律 5）
provider = "github-actions"
expected_branch = "main"
